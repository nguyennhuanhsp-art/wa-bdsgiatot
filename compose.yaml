services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: bds_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bdsgiatot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bds_owner -d bdsgiatot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  bds_pgdata:
